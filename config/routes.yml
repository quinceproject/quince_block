# Trasy panelu quince_block.
#
# Wszystkie mają `_legacy_controller: 'AdminQuinceBlock'`: moduł ma jedną zakładkę
# w menu i na niej wiszą uprawnienia sprawdzane przez `#[AdminSecurity]`.
# Widoki: GET. Zapisy i akcje: POST + CSRF (identyfikator tokenu = nazwa trasy,
# wywołania z JS niosą token panelu `quince_block_panel` w nagłówku X-CSRF-Token).
# `_legacy_link` jest unikalny dla każdej trasy; wejście z menu to `AdminQuinceBlock`.
# Trasa wskazująca nieistniejącą metodę wywraca router całego panelu, więc trasa
# i akcja powstają razem.

# Bloki: lista
quince_block_blocks:
  path: quince/block
  methods: [GET]
  defaults:
    _controller: Quince\Block\Controller\Admin\BlocksController::indexAction
    _legacy_controller: 'AdminQuinceBlock'
    _legacy_link: 'AdminQuinceBlock'

quince_block_block_toggle:
  path: quince/block/toggle
  methods: [POST]
  defaults:
    _controller: Quince\Block\Controller\Admin\BlocksController::toggleAction
    _legacy_controller: 'AdminQuinceBlock'
    _legacy_link: 'AdminQuinceBlock:toggle'

quince_block_block_bulk:
  path: quince/block/bulk
  methods: [POST]
  defaults:
    _controller: Quince\Block\Controller\Admin\BlocksController::bulkAction
    _legacy_controller: 'AdminQuinceBlock'
    _legacy_link: 'AdminQuinceBlock:bulk'

quince_block_block_duplicate:
  path: quince/block/duplicate
  methods: [POST]
  defaults:
    _controller: Quince\Block\Controller\Admin\BlocksController::duplicateAction
    _legacy_controller: 'AdminQuinceBlock'
    _legacy_link: 'AdminQuinceBlock:duplicate'

quince_block_block_delete:
  path: quince/block/delete
  methods: [POST]
  defaults:
    _controller: Quince\Block\Controller\Admin\BlocksController::deleteAction
    _legacy_controller: 'AdminQuinceBlock'
    _legacy_link: 'AdminQuinceBlock:delete'

# Bloki: edycja (id 0 = nowy blok)
quince_block_block_edit:
  path: quince/block/edit/{id}
  methods: [GET]
  requirements:
    id: \d+
  defaults:
    _controller: Quince\Block\Controller\Admin\BlockEditController::editAction
    _legacy_controller: 'AdminQuinceBlock'
    _legacy_link: 'AdminQuinceBlock:edit'

quince_block_block_save:
